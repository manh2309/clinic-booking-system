services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: clinic_booking
      MYSQL_USER: clinic
      MYSQL_PASSWORD: clinic_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - clinic_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/clinic_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: clinic
      DB_PASSWORD: clinic_password
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: Admin@123
      BOOTSTRAP_ADMIN_EMAIL: admin@clinic.local
    ports:
      - "8080:8080"

volumes:
  clinic_mysql_data:
